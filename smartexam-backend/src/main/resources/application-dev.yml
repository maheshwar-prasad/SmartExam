server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online_exam?useSSL=false&serverTimezone=UTC
    username: exam_user
    password: exam_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    document-storage:
      type: local
      base-path: ./storage/ai-documents
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434

      chat:
        model: qwen3:8b
        temperature: 0.2
        think: false
        keep-alive: 10m
        num-ctx: 4096
        num-predict: 1000

      embedding:
        model: nomic-embed-text
        keep-alive: 10m
        truncate: true
        num-ctx: 2048

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: smartexam_documents
        content-field-name: doc_content
        use-tls: false
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
smartexam:
  ai:
    enabled: true
    max-retry: 3
    max-questions-per-request: 50
    max-prompt-length: 10000

    document-chunk-size: 7000
    document-chunk-overlap: 300
    document-max-chunks: 50
  storage:
    base-directory: ./uploads
    staff-photos:
      location: ./uploads/staff
    teacher-photos:
      location: ./uploads/teachers
    student-documents:
      location: ./uploads/student-documents
    student-id-cards:
      location: ./uploads/student-id-cards
    organization-logos:
      location: ./uploads/organization-logos
    institution-logos:
      location: ./uploads/institution-logos
    staff-documents:
      location: ./uploads/staff-documents

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}

logging:
  level:
    root: INFO