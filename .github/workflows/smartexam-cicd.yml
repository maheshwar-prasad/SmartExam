  name: SmartExam CI Pipeline
  on:
    push:
      branches:
        - main
        - develop
        - 'feature/**'
    pull_request:
      branches:
        - main
        - develop
    workflow_dispatch:
  permissions:
    contents: read

  jobs:

    # ======================================
    # BACKEND BUILD AND JUNIT TEST
    # ======================================
    backend-build-test:
      name: Backend Build and Test
      runs-on: ubuntu-latest

      services:
        mysql:
          image: mysql:8.4
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: online_exam
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=15
      env:
        SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
        SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Verify Java
          run: |
            java -version
            mvn -version

        - name: Verify MySQL
          run: |
            mysqladmin ping -h 127.0.0.1 -uroot -proot

        - name: Build and Test Backend
          working-directory: smartexam-backend
          run: mvn -B clean verify

        - name: Upload Test Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: backend-test-reports
            path: smartexam-backend/target/surefire-reports/
            if-no-files-found: ignore

    # ======================================
    # FRONTEND BUILD
    # ======================================
    frontend-build:
      name: Angular Build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: smartexam-ui/package-lock.json

        - name: Install Dependencies
          working-directory: smartexam-ui
          run: npm ci

        - name: Angular Production Build
          working-directory: smartexam-ui
          run: npm run build -- --configuration production

    # ======================================
    # SECURITY CHECK
    # ======================================
    security-check:
      name: Security Scan
      runs-on: ubuntu-latest
      needs:
        - backend-build-test
        - frontend-build

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '22'

        - name: Backend Dependency Security Check
          working-directory: smartexam-backend
          run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML
          continue-on-error: true

        - name: Frontend Dependency Security Check
          working-directory: smartexam-ui
          run: |
            npm ci
            npm audit --audit-level=high

        - name: Trivy Filesystem Security Scan
          uses: aquasecurity/trivy-action@0.28.0
          with:
            scan-type: fs
            scan-ref: .
            scanners: vuln,misconfig,secret
            severity: HIGH,CRITICAL
            ignore-unfixed: true
            exit-code: '1'

    # ======================================
    # DOCKER BUILD
    # ======================================
    docker-build:
      name: Docker Image Build
      runs-on: ubuntu-latest
      needs:
        - backend-build-test
        - frontend-build
        - security-check

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Build Backend JAR
          working-directory: smartexam-backend
          run: mvn -B clean package -DskipTests

        - name: Build Backend Docker Image
          run: |
            docker build \
              -t smartexam-backend:latest \
              ./smartexam-backend

        - name: Build Frontend Docker Image
          run: |
            docker build \
              -t smartexam-frontend:latest \
              ./smartexam-ui

        - name: Docker Build Completed
          run: echo "SmartExam Docker images built successfully!"