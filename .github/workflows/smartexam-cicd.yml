  name: SmartExam CI Pipeline
  on:
    push:
      branches:
        - main
        - develop
        - feature

    pull_request:
      branches:
        - main
        - develop
        - feature

    workflow_dispatch:

  permissions:
    contents: read
  jobs:

    # ======================================
    # BACKEND BUILD AND JUNIT TEST
    # ======================================

    backend-build-test:
      name: Backend Build & JUnit Tests
      runs-on: ubuntu-latest
      # Temporary MySQL database for CI testing
      services:
        mysql:
          image: mysql:8.4
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: smart_exam
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=10
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/smart_exam?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Verify Java Version
          run: java -version

        - name: Verify MySQL Connection
          run: |
            sudo apt-get update
            sudo apt-get install -y mysql-client
            mysqladmin ping -h 127.0.0.1 -uroot -proot

        - name: Build Backend and Run JUnit Tests
          working-directory: smartexam-backend
          run: mvn -B clean verify

        - name: Upload JUnit Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: junit-test-reports
            path: smartexam-backend/target/surefire-reports/
            if-no-files-found: ignore

    # ======================================
    # FRONTEND BUILD
    # ======================================

    frontend-build:

      name: Angular Build
      runs-on: ubuntu-latest
      needs:
        - backend-build-test
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '22'

        - name: Install Dependencies
          working-directory: smartexam-ui
          run: npm ci

        - name: Angular Production Build
          working-directory: smartexam-ui
          run: npm run build -- --configuration production

    # ======================================
    # SECURITY CHECK
    # ======================================

    security-check:

      name: Security Scan
      runs-on: ubuntu-latest
      needs:
        - backend-build-test
        - frontend-build
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '22'

        - name: Backend Dependency Security Check
          working-directory: smartexam-backend
          run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML
          continue-on-error: true

        - name: Frontend Dependency Security Check
          working-directory: smartexam-ui
          run: |
            npm ci
            npm audit --audit-level=high

        - name: Trivy Filesystem Security Scan
          uses: aquasecurity/trivy-action@0.28.0
          with:
            scan-type: fs
            scan-ref: .
            scanners: vuln,misconfig,secret
            severity: HIGH,CRITICAL
            ignore-unfixed: true
            exit-code: '1'

    # ======================================
    # DOCKER BUILD
    # ======================================

    docker-build:
      name: Docker Image Build
      runs-on: ubuntu-latest
      needs:
        - backend-build-test
        - frontend-build
        - security-check

      steps:

        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Build Backend JAR
          working-directory: smartexam-backend
          run: mvn clean package -DskipTests

        - name: Build Backend Docker Image
          run: |
            docker build \
              -t smartexam-backend:latest \
              ./smartexam-backend

        - name: Build Frontend Docker Image
          run: |
            docker build \
              -t smartexam-frontend:latest \
              ./smartexam-ui

        - name: Docker Build Completed
          run: echo "SmartExam Docker images built successfully!"

